<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE CROWN ADMIN</title><style>:root{--g:#d4af55;--t:#f5f1e8;--m:#9a978f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#292213,#0b0b0b 35%,#080808 75%);color:var(--t);font-family:system-ui,"Noto Sans JP",sans-serif}.wrap{max-width:980px;margin:auto;padding:24px}.brand{font-family:Georgia,serif;color:var(--g);font-size:28px;letter-spacing:.12em}.card{background:#131313;border:1px solid #493b20;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{background:linear-gradient(#e1bd63,#b58e37);border:0;color:#111;font-weight:800;border-radius:11px;padding:11px 14px;cursor:pointer}.btn2{background:#1d1b16;border:1px solid #6b572b;color:#e1bd63;border-radius:10px;padding:10px 13px;cursor:pointer}.danger{border-color:#733;color:#f99}.muted{color:var(--m);font-size:12px}.gold{color:var(--g)}input,select{width:100%;background:#0d0d0d;border:1px solid #39342a;color:#eee;border-radius:9px;padding:11px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.tourActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:650px){.formgrid{grid-template-columns:1fr}}.hidden{display:none}.tabs{display:flex;gap:8px;margin:18px 0}.ring{border-color:#6f5720}.closed{opacity:.65}.count{font-size:24px;font-weight:900;color:var(--g)}.status{padding:5px 9px;border-radius:99px;font-size:11px;border:1px solid #286b49;color:#62e59c}.err{color:#ff8e8e}.ok{color:#6ee7a5}.quickBtn{min-width:200px!important;min-height:72px!important;padding:18px 28px!important;font-size:20px!important;font-weight:800!important;background:linear-gradient(#e1bd63,#b58e37)!important;color:#111!important;border:0!important;border-radius:14px!important}</style></head><body><div class="wrap"><div class="brand">THE CROWN <small>ADMIN</small></div>
<section id="setup" class="card"><h2>初回接続</h2><p class="muted">このWeb版ではProject URLは固定済みです。Publishable keyだけ初回に保存します。</p><input id="key" placeholder="sb_publishable_..."><button class="btn" style="margin-top:12px" onclick="saveKey()">接続して保存</button><div id="setupMsg"></div></section>
<section id="login" class="card hidden"><h2>管理画面ログイン</h2><label>メールアドレス<input id="email" type="email" autocomplete="username"></label><label>パスワード<input id="pw" type="password" autocomplete="current-password"></label><button class="btn" style="margin-top:12px" onclick="login()">ログイン</button><div id="loginMsg"></div></section>
<section id="admin" class="hidden"><div class="row"><h2>店舗管理</h2><button class="btn2" onclick="logout()">ログアウト</button></div><div class="tabs"><button class="btn2" onclick="showTab('ring')">RING</button><button class="btn2" onclick="showTab('tour')">トーナメント</button></div>
<div id="ringTab"><div class="card"><div class="row"><div><h3>クイックOPEN</h3><p class="muted">ワンタップで卓を作成</p></div><button class="btn2" onclick="loadRing()">更新</button></div><div class="row"><button class="btn quickBtn" onclick="quick('NLH','50/100',10,5)">50/100 NLH</button><button class="btn quickBtn" onclick="quick('NLH','100/200',10,3)">100/200 NLH</button><button class="btn quickBtn" onclick="quick('MIX','',10,3)">MIX</button></div><div id="msg"></div></div><div id="rings"></div></div>
<div id="tourTab" class="hidden"><div class="card"><div class="row"><div><h3 id="tourFormTitle">トーナメント新規作成</h3><p class="muted">Supabaseへ保存します。</p></div><button class="btn2" onclick="resetTourForm()">入力をクリア</button></div><input type="hidden" id="tourId"><div class="formgrid"><div class="field"><label>トーナメント名</label><input id="tourName"></div><div class="field"><label>開催日</label><input id="tourDate" type="date"></div><div class="field"><label>START</label><input id="tourStart" type="time"></div><div class="field"><label>公開設定</label><select id="tourPublished"><option value="true">公開</option><option value="false">非公開</option></select></div></div><div class="tourActions"><button class="btn" onclick="saveTour()">保存</button></div><div id="tourMsg"></div></div><div class="card"><div class="row"><h3>今月の登録済みトーナメント</h3><button class="btn2" onclick="loadTours()">更新</button></div></div><div id="tours"></div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://rswptjjadknxvbemvrzu.supabase.co';let sb=null,staff=null;
function key(){return localStorage.getItem('crown_publishable_key')||''}function init(){if(!key())return false;sb=supabase.createClient(SUPABASE_URL,key());return true}
function vis(id,on){document.getElementById(id).classList.toggle('hidden',!on)}function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function saveKey(){const k=document.getElementById('key').value.trim();if(!k.startsWith('sb_publishable_')&&!k.startsWith('eyJ'))return document.getElementById('setupMsg').innerHTML='<p class="err">Publishable keyを確認してください。</p>';try{const r=await fetch(SUPABASE_URL+'/auth/v1/settings',{headers:{apikey:k}});if(!r.ok)throw new Error('HTTP '+r.status);localStorage.setItem('crown_publishable_key',k);init();vis('setup',false);vis('login',true)}catch(e){document.getElementById('setupMsg').innerHTML='<p class="err">接続できません：'+esc(e.message)+'</p>'}}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('pw').value;const k=key();try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:k,Authorization:'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const p=await r.json();if(!r.ok)throw new Error(p.msg||p.message||('HTTP '+r.status));const s=await sb.auth.setSession({access_token:p.access_token,refresh_token:p.refresh_token});if(s.error)throw s.error;const {data,error}=await sb.from('staff').select('id,display_name,role,active').eq('auth_user_id',p.user.id).eq('active',true).maybeSingle();if(error||!data||!['admin','staff'].includes(data.role))throw new Error('CROWN ADMIN権限がありません');staff=data;vis('login',false);vis('admin',true);loadRing()}catch(e){document.getElementById('loginMsg').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function boot(){if(!init()){vis('setup',true);vis('login',false);return}const {data}=await sb.auth.getSession();if(data.session){const q=await sb.from('staff').select('id,display_name,role,active').eq('auth_user_id',data.session.user.id).eq('active',true).maybeSingle();if(q.data){staff=q.data;vis('setup',false);vis('login',false);vis('admin',true);loadRing();return}}vis('setup',false);vis('login',true)}
async function logout(){await sb.auth.signOut();vis('admin',false);vis('login',true)}
function showTab(x){vis('ringTab',x==='ring');vis('tourTab',x==='tour');if(x==='tour')loadTours()}
async function nextName(){const {data}=await sb.from('ring_tables').select('table_name');const u=new Set((data||[]).map(x=>String(x.table_name||'').toUpperCase()));let n=1;while(u.has('TABLE '+n)||u.has('TABLE'+n))n++;return 'TABLE '+n}
async function quick(game,stakes,rake,cap){try{const name=await nextName();const {data}=await sb.from('ring_tables').select('display_order');const order=Math.max(0,...(data||[]).map(x=>Number(x.display_order)||0))+1;const {error}=await sb.from('ring_tables').insert({table_name:name,game_type:game,stakes,max_players:9,rake_percent:rake,rake_cap_bb:cap,status:'open',display_order:order,current_players:0});if(error)throw error;note('OPENしました');loadRing()}catch(e){note(e.message,false)}}
function note(t,ok=true){document.getElementById('msg').innerHTML='<p class="'+(ok?'ok':'err')+'">'+esc(t)+'</p>'}
async function loadRing(){const h=document.getElementById('rings');const {data,error}=await sb.from('ring_tables').select('*').order('display_order');if(error){h.innerHTML='<div class="card err">'+esc(error.message)+'</div>';return}const rows=(data||[]).sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1));h.innerHTML=rows.length?rows.map(x=>{const open=x.status==='open',cur=Number(x.current_players)||0,max=Number(x.max_players)||9,title=x.game_type==='MIX'?'MIX':esc(x.stakes);return `<div class="card ring ${open?'':'closed'}"><div class="row"><div><h2>${title}</h2><p class="muted">${esc(x.game_type)}　${x.rake_percent??'-'}% / ${x.rake_cap_bb??'-'}BB CAP</p></div><span class="status">${open?'● 稼働中':'停止中'}</span></div><div class="row"><button class="btn2" onclick="players('${x.id}',${cur},${max},-1)">−</button><span class="count">${cur} / ${max}</span><button class="btn2" onclick="players('${x.id}',${cur},${max},1)">＋</button><button class="btn2" onclick="toggle('${x.id}','${x.status}')">${open?'CLOSE':'OPEN'}</button><button class="btn2 danger" onclick="del('${x.id}','${title}')">削除</button></div></div>`}).join(''):'<div class="card muted">登録済みテーブルはありません。</div>'}
async function players(id,cur,max,d){const n=Math.max(0,Math.min(max,cur+d));if(n===cur)return;const {error}=await sb.from('ring_tables').update({current_players:n}).eq('id',id);if(error)return note(error.message,false);loadRing()}
async function toggle(id,s){const next=s==='open'?'closed':'open',p={status:next};if(next==='closed')p.current_players=0;const {error}=await sb.from('ring_tables').update(p).eq('id',id);if(error)return note(error.message,false);loadRing()}
async function del(id,label){if(!confirm(label+' を完全に削除しますか？'))return;const {data,error}=await sb.from('ring_tables').delete().eq('id',id).select('id');if(error)return note(error.message,false);if(!data?.length)return note('削除権限がありません',false);loadRing()}
let tourCache={};
function tourNote(t,ok=true){document.getElementById('tourMsg').innerHTML='<p class="'+(ok?'ok':'err')+'">'+esc(t)+'</p>'}
function resetTourForm(){['tourId','tourName','tourDate','tourStart'].forEach(id=>document.getElementById(id).value='');document.getElementById('tourPublished').value='true';document.getElementById('tourFormTitle').textContent='トーナメント新規作成'}
function editTour(id){const x=tourCache[id];if(!x)return;document.getElementById('tourId').value=x.id;document.getElementById('tourName').value=x.name||'';document.getElementById('tourDate').value=x.event_date||'';document.getElementById('tourStart').value=(x.start_time||'').slice(0,5);document.getElementById('tourPublished').value=String(!!x.published);document.getElementById('tourFormTitle').textContent='トーナメント編集';window.scrollTo({top:0,behavior:'smooth'})}
async function saveTour(){const id=document.getElementById('tourId').value,name=document.getElementById('tourName').value.trim(),event_date=document.getElementById('tourDate').value,start_time=document.getElementById('tourStart').value,published=document.getElementById('tourPublished').value==='true';if(!name||!event_date||!start_time)return tourNote('トーナメント名・開催日・STARTを入力してください。',false);const p={name,event_date,start_time,published,status:'scheduled'};const q=id?sb.from('tournaments').update(p).eq('id',id):sb.from('tournaments').insert(p);const {error}=await q;if(error)return tourNote(error.message,false);resetTourForm();loadTours()}
async function setTourPublished(id,published){const {error}=await sb.from('tournaments').update({published}).eq('id',id);if(error)return tourNote(error.message,false);loadTours()}
async function cancelTour(id){if(!confirm('このトーナメントを中止にしますか？'))return;const {error}=await sb.from('tournaments').update({status:'cancelled'}).eq('id',id);if(error)return tourNote(error.message,false);loadTours()}
async function deleteTour(id){if(!confirm('このトーナメントを完全に削除しますか？'))return;const {data,error}=await sb.from('tournaments').delete().eq('id',id).select('id');if(error)return tourNote(error.message,false);if(!data||!data.length)return tourNote('削除権限がありません。',false);loadTours()}
async function loadTours(){const h=document.getElementById('tours'),d=new Date(),from=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01',to=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(new Date(d.getFullYear(),d.getMonth()+1,0).getDate()).padStart(2,'0');const {data,error}=await sb.from('tournaments').select('*').gte('event_date',from).lte('event_date',to).order('event_date').order('start_time');if(error){h.innerHTML='<div class="card err">'+esc(error.message)+'</div>';return}tourCache={};(data||[]).forEach(x=>tourCache[x.id]=x);h.innerHTML=(data||[]).map(x=>'<div class="card"><b class="gold">'+esc(x.event_date)+'　'+esc((x.start_time||'').slice(0,5))+'</b><h3>'+esc(x.name)+'</h3><p class="muted">'+(x.published?'公開中':'非公開')+' / '+(x.status==='cancelled'?'中止':esc(x.status))+'</p><div class="tourActions"><button class="btn2" onclick="editTour(\''+x.id+'\')">編集</button><button class="btn2" onclick="setTourPublished(\''+x.id+'\','+(!x.published)+')">'+(x.published?'非公開にする':'公開する')+'</button>'+(x.status!=='cancelled'?'<button class="btn2" onclick="cancelTour(\''+x.id+'\')">中止</button>':'')+'<button class="btn2 danger" onclick="deleteTour(\''+x.id+'\')">削除</button></div></div>').join('')||'<div class="card muted">今月の登録はありません。</div>'}

boot();
</script></body></html>
