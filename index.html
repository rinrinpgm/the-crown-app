<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE CROWN</title><style>
:root{--bg:#090909;--panel:#121212;--gold:#d4af55;--text:#f5f1e8;--muted:#9a978f}.card{background:linear-gradient(145deg,#181818,#101010);border:1px solid #302a1d;border-radius:17px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:var(--muted);font-size:12px}.pill{border-radius:99px;padding:5px 9px;font-size:11px;border:1px solid #3d3d3d}.live{color:#62e59c;border-color:#2c6a4a;background:#102319}.btn2{background:#1d1b16;border:1px solid #6b572b;color:#e1bd63;border-radius:10px;padding:9px 12px;cursor:pointer}.homeHero{overflow:hidden;padding:0}.homeHero img{width:100%;display:block;max-height:360px;object-fit:cover}.homeHeroText{padding:16px}.homeSection{margin-top:22px}.homeSectionTitle{font-family:Georgia,"Noto Serif JP",serif;font-size:18px;margin:0 0 8px}.statusGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.statusBox{background:#0c0c0c;border:1px solid #302a1d;border-radius:14px;padding:12px 8px;text-align:center}.statusBox small{display:block;color:var(--muted);font-size:9px;margin-bottom:6px}.statusBox b{font-size:16px}.homeList .card{margin:8px 0}.homeHeroPlaceholder{min-height:170px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1b170f,#090909);color:var(--gold);font-family:Georgia,serif;letter-spacing:.12em}.gold{color:var(--gold)}.tourCard{cursor:pointer;transition:.18s}.tourCard:active{transform:scale(.99)}.tourHint{font-size:11px;color:var(--gold);margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;padding:20px;overflow:auto}.modal.open{display:flex;align-items:flex-start;justify-content:center}.modalBox{width:min(680px,100%);margin:36px auto;background:linear-gradient(145deg,#181818,#0d0d0d);border:1px solid #6b572b;border-radius:20px;padding:20px;box-shadow:0 24px 70px #000}.modalHead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.modalClose{background:#1d1b16;border:1px solid #6b572b;color:var(--gold);border-radius:10px;padding:9px 13px;font-size:18px}.tourImage{width:100%;max-height:440px;object-fit:contain;border-radius:14px;background:#080808;margin:14px 0}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detailItem{background:#0c0c0c;border:1px solid #302a1d;border-radius:12px;padding:12px}.detailItem small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.detailText{white-space:pre-wrap;line-height:1.7}.gold{color:var(--gold)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#292213 0,#0c0c0c 32%,#080808 75%);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif;min-height:100vh}.shell{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.header{position:sticky;top:0;z-index:20;background:#090909ef;backdrop-filter:blur(12px);border-bottom:1px solid #292419;padding:12px 18px}.brand{font-family:Georgia,serif;color:var(--gold);font-size:24px;letter-spacing:.12em}.content{padding:18px}.title{font-family:Georgia,"Noto Serif JP",serif;font-size:28px;margin:3px 0 16px}.page{display:none}.page.active{display:block}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#0b0b0bf5;border-top:1px solid #332c1e;display:grid;grid-template-columns:repeat(5,1fr);z-index:30}.nav button{background:none;border:0;color:#777;padding:12px 2px 10px;font-size:10px}.nav button.active{color:var(--gold)}.nav .ico{display:block;font-size:19px;margin-bottom:4px}
 .monthPicker{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px}.monthArrow{width:48px;height:48px;border-radius:15px;border:1px solid #71571e;background:#111;color:var(--gold);font-size:27px;line-height:1;cursor:pointer}.monthArrow:active{transform:scale(.96);background:#1a160d}.monthCenter{position:relative;min-width:180px;height:48px;border:1px solid #71571e;border-radius:15px;background:linear-gradient(180deg,#17140e,#0d0d0d);display:flex;align-items:center;justify-content:center;color:#f2eadc;font-family:Georgia,"Noto Serif JP",serif;font-weight:700;font-size:20px;letter-spacing:.08em;box-shadow:inset 0 0 0 1px #1e1a12}.monthCenter .monthInput{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.monthCenter small{color:var(--gold);font-size:11px;letter-spacing:.14em;margin-right:9px;font-family:Arial,sans-serif;font-weight:500}@media(max-width:390px){.monthCenter{min-width:165px;font-size:18px}.monthArrow{width:44px;height:44px}}</style></head><body><div class="shell"><header class="header"><div class="brand">THE CROWN</div></header><main class="content">
<section id="home" class="page active"><h1 class="title">THE CROWN</h1><div id="homeFeatured"><div class="card muted">HOMEを読み込み中…</div></div><div class="homeSection"><h2 class="homeSectionTitle">NEXT EVENT</h2><div id="homeNext"><div class="card muted">読み込み中…</div></div></div><div class="homeSection"><h2 class="homeSectionTitle">CROWN STATUS</h2><div id="homeStatus" class="statusGrid"><div class="statusBox"><small>OPEN</small><b>—</b></div><div class="statusBox"><small>RING</small><b>—</b></div><div class="statusBox"><small>TODAY</small><b>—</b></div></div></div><div class="homeSection"><h2 class="homeSectionTitle">CAMPAIGN / PICK UP</h2><div id="homeCampaigns" class="homeList"><div class="card muted">読み込み中…</div></div></div><div class="homeSection"><h2 class="homeSectionTitle">NEWS</h2><div id="homeNews" class="homeList"><div class="card muted">読み込み中…</div></div></div></section>
<section id="tournament" class="page"><h1 class="title">トーナメント</h1><div class="card"><div class="monthPicker"><button class="monthArrow" type="button" onclick="moveTourMonth(-1)" aria-label="前月">‹</button><div class="monthCenter"><small>MONTH</small><span id="tourMonthLabel">----</span><input id="tourMonth" class="monthInput" type="month" onchange="syncTourMonth()"></div><button class="monthArrow" type="button" onclick="moveTourMonth(1)" aria-label="翌月">›</button></div></div><div id="tourList"><div class="card muted">読み込み中…</div></div></section>
<section id="ring" class="page"><h1 class="title">リングゲーム</h1><div class="row"><span class="muted">現在のOPEN卓</span><button class="btn2" onclick="loadRing()">更新</button></div><div id="ringList"><div class="card muted">読み込み中…</div></div></section>
<section id="ranking" class="page"><h1 class="title">ランキング</h1><div class="card muted">ランキング機能は準備中です。</div></section>
<section id="my" class="page"><h1 class="title">MY CROWN</h1><div class="card muted">会員QR・Crown coin・クーポン機能は次の実装で接続します。</div></section>
</main><div id="tourModal" class="modal" onclick="if(event.target===this)closeTournament()"><div class="modalBox"><div class="modalHead"><div><div class="gold" style="font-size:12px;letter-spacing:.12em">TOURNAMENT</div><h2 id="tdName" style="margin:5px 0 0"></h2></div><button class="modalClose" onclick="closeTournament()">×</button></div><div id="tdBody"></div></div></div><nav class="nav"><button class="active" data-p="home" onclick="show('home')"><span class="ico">⌂</span>HOME</button><button data-p="tournament" onclick="show('tournament')"><span class="ico">♠</span>トーナメント</button><button data-p="ring" onclick="show('ring')"><span class="ico">♣</span>RING</button><button data-p="ranking" onclick="show('ranking')"><span class="ico">♛</span>ランキング</button><button data-p="my" onclick="show('my')"><span class="ico">♦</span>MY CROWN</button></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://rswptjjadknxvbemvrzu.supabase.co'; let sb=null;
function cfg(){try{return JSON.parse(localStorage.getItem('crown_supabase_config')||'null')}catch(e){return null}}
function init(){const c=cfg();if(!c?.key)return false;sb=supabase.createClient(SUPABASE_URL,c.key);return true}
function setup(){const key=prompt('初回のみ：Supabase Publishable key（sb_publishable_...）を入力してください');if(!key)return false;localStorage.setItem('crown_supabase_config',JSON.stringify({url:URL,key:key.trim()}));return init()}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===id));if(id==='ring')loadRing();if(id==='tournament')loadTournaments();if(id==='home')loadHome()}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function jpDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pick(obj,names){for(const n of names)if(obj&&obj[n]!=null&&obj[n]!=='')return obj[n];return null}
async function safeRows(table,limit=20){try{const q=await sb.from(table).select('*').limit(limit);const r=await q;return r.error?[]:(r.data||[])}catch(e){return[]}}
async function loadHome(){if(!sb&&!init()&&!setup())return;const today=jpDate(new Date());const [rings,tours,banners,campaigns,news]=await Promise.all([safeRows('ring_tables',100),safeRows('tournaments',200),safeRows('home_banners',20),safeRows('campaigns',30),safeRows('news',30)]);const openRings=rings.filter(x=>x.status==='open');const publicTours=tours.filter(x=>x.published===true&&x.status!=='cancelled'&&x.event_date>=today).sort((a,b)=>(a.event_date+(a.start_time||'')).localeCompare(b.event_date+(b.start_time||'')));const todayTours=publicTours.filter(x=>x.event_date===today);const next=publicTours[0];const nh=document.getElementById('homeNext');if(next){window._homeNext=next;nh.innerHTML=`<div class="card tourCard" onclick="openHomeNext()"><b class="gold">${esc(next.event_date)}　${esc((next.start_time||'').slice(0,5))}</b><h3 style="margin-bottom:6px">${esc(next.name)}</h3><p class="muted">ENTRY ${yen(next.entry_fee)}${next.starting_stack?' / '+num(next.starting_stack)+' STACK':''}</p><div class="tourHint">詳細を見る ›</div></div>`}else nh.innerHTML='<div class="card muted">次回イベントは現在未登録です。</div>';document.getElementById('homeStatus').innerHTML=`<div class="statusBox"><small>OPEN</small><b>平日16:00〜<br>土日祝15:00〜</b></div><div class="statusBox"><small>RING</small><b>${openRings.length}卓</b></div><div class="statusBox"><small>TODAY</small><b>${todayTours.length} EVENT</b></div>`;const active=x=>pick(x,['published','is_published','active','is_active','visible'])!==false;const banner=banners.filter(active).sort((a,b)=>Number(pick(a,['display_order','sort_order','priority'])||0)-Number(pick(b,['display_order','sort_order','priority'])||0))[0];const bh=document.getElementById('homeFeatured');if(banner){const img=pick(banner,['image_url','image','banner_url']);const title=pick(banner,['title','name','headline'])||'FEATURED EVENT';const sub=pick(banner,['description','subtitle','body','text']);bh.innerHTML=`<div class="card homeHero">${img?'<img src="'+esc(img)+'" alt="">':'<div class="homeHeroPlaceholder">FEATURED EVENT</div>'}<div class="homeHeroText"><div class="gold" style="font-size:11px;letter-spacing:.12em">FEATURED EVENT</div><h2 style="margin:5px 0">${esc(title)}</h2>${sub?'<p class="muted">'+esc(sub)+'</p>':''}</div></div>`}else bh.innerHTML='<div class="card homeHero"><div class="homeHeroPlaceholder">THE CROWN</div><div class="homeHeroText"><b class="gold">FEATURED EVENT</b><p class="muted">管理画面からおすすめ情報を掲載できます。</p></div></div>';const ch=document.getElementById('homeCampaigns'),cs=campaigns.filter(active).slice(0,3);ch.innerHTML=cs.length?cs.map(x=>`<div class="card"><b class="gold">${esc(pick(x,['title','name'])||'CAMPAIGN')}</b>${pick(x,['description','body','text'])?'<p class="muted">'+esc(pick(x,['description','body','text']))+'</p>':''}</div>`).join(''):'<div class="card muted">現在公開中のキャンペーンはありません。</div>';const nw=document.getElementById('homeNews'),ns=news.filter(active).sort((a,b)=>String(pick(b,['published_at','created_at','date'])||'').localeCompare(String(pick(a,['published_at','created_at','date'])||''))).slice(0,5);nw.innerHTML=ns.length?ns.map(x=>`<div class="card"><b>${esc(pick(x,['title','name'])||'お知らせ')}</b>${pick(x,['body','description','content','text'])?'<p class="muted">'+esc(pick(x,['body','description','content','text']))+'</p>':''}</div>`).join(''):'<div class="card muted">お知らせはありません。</div>'}
function openHomeNext(){const x=window._homeNext;if(!x)return;window._crownTours=[x];openTournament(0)}
async function loadRing(){const h=document.getElementById('ringList');if(!sb&&!init()&&!setup()){h.innerHTML='<div class="card muted">接続設定が必要です。</div>';return}const {data,error}=await sb.from('ring_tables').select('*').eq('status','open').order('display_order');if(error){h.innerHTML='<div class="card muted">'+esc(error.message)+'</div>';return}h.innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="card"><div class="row"><div><h2 style="margin:3px 0">${x.game_type==='MIX'?'MIX':esc(x.stakes)}</h2><p class="muted">${x.game_type==='MIX'?'MIX GAME':esc(x.game_type)}</p></div><span class="pill live">● 稼働中</span></div><div class="row"><span>参加人数</span><b class="gold">${Number(x.current_players)||0} / ${Number(x.max_players)||9}</b></div></div>`).join(''):'<div class="card muted">現在稼働中のRINGテーブルはありません。</div>'}
function updateTourMonthLabel(){const v=document.getElementById('tourMonth')?.value;if(!v)return;const [y,m]=v.split('-');document.getElementById('tourMonthLabel').textContent=y+' / '+m}
function syncTourMonth(){updateTourMonthLabel();loadTournaments()}
function moveTourMonth(delta){const el=document.getElementById('tourMonth');let v=el.value;if(!v){const d=new Date();v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}let [y,m]=v.split('-').map(Number);m+=delta;if(m<1){m=12;y--}if(m>12){m=1;y++}el.value=y+'-'+String(m).padStart(2,'0');syncTourMonth()}
async function loadTournaments(){const h=document.getElementById('tourList');if(!sb&&!init()&&!setup()){h.innerHTML='<div class="card muted">接続設定が必要です。</div>';return}const m=document.getElementById('tourMonth');if(!m.value){const d=new Date();m.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}const [y,mo]=m.value.split('-').map(Number),last=new Date(y,mo,0).getDate(),from=m.value+'-01',to=m.value+'-'+String(last).padStart(2,'0');const {data,error}=await sb.from('tournaments').select('*').gte('event_date',from).lte('event_date',to).eq('published',true).order('event_date').order('start_time');if(error){h.innerHTML='<div class="card muted">'+esc(error.message)+'</div>';return}window._crownTours=data||[];h.innerHTML=(data||[]).length?(data||[]).map((x,i)=>`<div class="card tourCard" onclick="openTournament(${i})"><b>${esc(x.event_date)}　${esc((x.start_time||'').slice(0,5))}</b><h3>${esc(x.name)}</h3><p class="muted">ENTRY ¥${Number(x.entry_fee||0).toLocaleString()}${x.starting_stack?' / '+Number(x.starting_stack).toLocaleString()+' STACK':''}</p><div class="tourHint">詳細を見る ›</div></div>`).join(''):'<div class="card muted">この月の公開トーナメントはありません。</div>'}
function yen(v){return v===null||v===undefined||v===''?'—':'¥'+Number(v).toLocaleString()}function num(v){return v===null||v===undefined||v===''?'—':Number(v).toLocaleString()}function openTournament(i){const x=(window._crownTours||[])[i];if(!x)return;document.getElementById('tdName').textContent=x.name||'';let image=x.image_url?`<img class="tourImage" src="${esc(x.image_url)}" alt="">`:'';let prize=x.prize?`<div class="detailItem" style="grid-column:1/-1"><small>PRIZE</small><div class="detailText">${esc(x.prize)}</div></div>`:'';let desc=x.description?`<div class="detailItem" style="grid-column:1/-1"><small>詳細・備考</small><div class="detailText">${esc(x.description)}</div></div>`:'';const start=(x.start_time||'').slice(0,5)||'—',late=(x.late_reg_time||'').slice(0,5)||'—';const sameStack=String(x.starting_stack??'')===String(x.reentry_stack??'')||!x.reentry_stack;const stackValue=sameStack?num(x.starting_stack):num(x.starting_stack)+' / '+num(x.reentry_stack);document.getElementById('tdBody').innerHTML=image+`<div class="detailGrid"><div class="detailItem"><small>開催日</small><b>${esc(x.event_date)}</b></div><div class="detailItem"><small>START / LATE</small><b>${esc(start)} / ${esc(late)}</b></div><div class="detailItem"><small>ENTRY / RE-ENTRY</small><b>${yen(x.entry_fee)} / ${yen(x.reentry_fee)}</b></div><div class="detailItem"><small>STACK</small><b>${stackValue}</b></div>${prize}${desc}</div>`;document.getElementById('tourModal').classList.add('open');document.body.style.overflow='hidden'}function closeTournament(){document.getElementById('tourModal').classList.remove('open');document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTournament()});window.addEventListener('DOMContentLoaded',()=>{if(init())loadHome()});setInterval(()=>{if(document.getElementById('ring').classList.contains('active'))loadRing()},5000);
</script></body></html>
