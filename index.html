<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE CROWN</title><style>
:root{--bg:#090909;--panel:#121212;--gold:#d4af55;--text:#f5f1e8;--muted:#9a978f}.card{background:linear-gradient(145deg,#181818,#101010);border:1px solid #302a1d;border-radius:17px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:var(--muted);font-size:12px}.pill{border-radius:99px;padding:5px 9px;font-size:11px;border:1px solid #3d3d3d}.live{color:#62e59c;border-color:#2c6a4a;background:#102319}.btn2{background:#1d1b16;border:1px solid #6b572b;color:#e1bd63;border-radius:10px;padding:9px 12px;cursor:pointer}.gold{color:var(--gold)}.tourCard{cursor:pointer;transition:.18s}.tourCard:active{transform:scale(.99)}.tourHint{font-size:11px;color:var(--gold);margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;padding:20px;overflow:auto}.modal.open{display:flex;align-items:flex-start;justify-content:center}.modalBox{width:min(680px,100%);margin:36px auto;background:linear-gradient(145deg,#181818,#0d0d0d);border:1px solid #6b572b;border-radius:20px;padding:20px;box-shadow:0 24px 70px #000}.modalHead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.modalClose{background:#1d1b16;border:1px solid #6b572b;color:var(--gold);border-radius:10px;padding:9px 13px;font-size:18px}.tourImage{width:100%;max-height:440px;object-fit:contain;border-radius:14px;background:#080808;margin:14px 0}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detailItem{background:#0c0c0c;border:1px solid #302a1d;border-radius:12px;padding:12px}.detailItem small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.detailText{white-space:pre-wrap;line-height:1.7}.gold{color:var(--gold)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#292213 0,#0c0c0c 32%,#080808 75%);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif;min-height:100vh}.shell{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.header{position:sticky;top:0;z-index:20;background:#090909ef;backdrop-filter:blur(12px);border-bottom:1px solid #292419;padding:12px 18px}.brand{font-family:Georgia,serif;color:var(--gold);font-size:24px;letter-spacing:.12em}.content{padding:18px}.title{font-family:Georgia,"Noto Serif JP",serif;font-size:28px;margin:3px 0 16px}.page{display:none}.page.active{display:block}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#0b0b0bf5;border-top:1px solid #332c1e;display:grid;grid-template-columns:repeat(5,1fr);z-index:30}.nav button{background:none;border:0;color:#777;padding:12px 2px 10px;font-size:10px}.nav button.active{color:var(--gold)}.nav .ico{display:block;font-size:19px;margin-bottom:4px}
</style></head><body><div class="shell"><header class="header"><div class="brand">THE CROWN</div></header><main class="content">
<section id="home" class="page active"><h1 class="title">THE CROWN</h1><div class="card"><b class="gold">CROWN WEB APP</b><h2>赤羽 THE CROWN</h2><p class="muted">トーナメント・RING情報をリアルタイムで確認できます。</p></div><div class="card"><div class="row"><b>RING</b><button class="btn2" onclick="show('ring')">現在の卓を見る</button></div></div></section>
<section id="tournament" class="page"><h1 class="title">トーナメント</h1><div class="card"><label>表示月 <input id="tourMonth" type="month" onchange="loadTournaments()"></label></div><div id="tourList"><div class="card muted">読み込み中…</div></div></section>
<section id="ring" class="page"><h1 class="title">リングゲーム</h1><div class="row"><span class="muted">現在のOPEN卓</span><button class="btn2" onclick="loadRing()">更新</button></div><div id="ringList"><div class="card muted">読み込み中…</div></div></section>
<section id="ranking" class="page"><h1 class="title">ランキング</h1><div class="card muted">ランキング機能は準備中です。</div></section>
<section id="my" class="page"><h1 class="title">MY CROWN</h1><div class="card muted">会員QR・Crown coin・クーポン機能は次の実装で接続します。</div></section>
</main><div id="tourModal" class="modal" onclick="if(event.target===this)closeTournament()"><div class="modalBox"><div class="modalHead"><div><div class="gold" style="font-size:12px;letter-spacing:.12em">TOURNAMENT</div><h2 id="tdName" style="margin:5px 0 0"></h2></div><button class="modalClose" onclick="closeTournament()">×</button></div><div id="tdBody"></div></div></div><nav class="nav"><button class="active" data-p="home" onclick="show('home')"><span class="ico">⌂</span>HOME</button><button data-p="tournament" onclick="show('tournament')"><span class="ico">♠</span>トーナメント</button><button data-p="ring" onclick="show('ring')"><span class="ico">♣</span>RING</button><button data-p="ranking" onclick="show('ranking')"><span class="ico">♛</span>ランキング</button><button data-p="my" onclick="show('my')"><span class="ico">♦</span>MY CROWN</button></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://rswptjjadknxvbemvrzu.supabase.co'; let sb=null;
function cfg(){try{return JSON.parse(localStorage.getItem('crown_supabase_config')||'null')}catch(e){return null}}
function init(){const c=cfg();if(!c?.key)return false;sb=supabase.createClient(SUPABASE_URL,c.key);return true}
function setup(){const key=prompt('初回のみ：Supabase Publishable key（sb_publishable_...）を入力してください');if(!key)return false;localStorage.setItem('crown_supabase_config',JSON.stringify({url:URL,key:key.trim()}));return init()}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===id));if(id==='ring')loadRing();if(id==='tournament')loadTournaments()}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function loadRing(){const h=document.getElementById('ringList');if(!sb&&!init()&&!setup()){h.innerHTML='<div class="card muted">接続設定が必要です。</div>';return}const {data,error}=await sb.from('ring_tables').select('*').eq('status','open').order('display_order');if(error){h.innerHTML='<div class="card muted">'+esc(error.message)+'</div>';return}h.innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="card"><div class="row"><div><h2 style="margin:3px 0">${x.game_type==='MIX'?'MIX':esc(x.stakes)}</h2><p class="muted">${x.game_type==='MIX'?'MIX GAME':esc(x.game_type)}</p></div><span class="pill live">● 稼働中</span></div><div class="row"><span>参加人数</span><b class="gold">${Number(x.current_players)||0} / ${Number(x.max_players)||9}</b></div></div>`).join(''):'<div class="card muted">現在稼働中のRINGテーブルはありません。</div>'}
async function loadTournaments(){const h=document.getElementById('tourList');if(!sb&&!init()&&!setup()){h.innerHTML='<div class="card muted">接続設定が必要です。</div>';return}const m=document.getElementById('tourMonth');if(!m.value){const d=new Date();m.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}const [y,mo]=m.value.split('-').map(Number),last=new Date(y,mo,0).getDate(),from=m.value+'-01',to=m.value+'-'+String(last).padStart(2,'0');const {data,error}=await sb.from('tournaments').select('*').gte('event_date',from).lte('event_date',to).eq('published',true).order('event_date').order('start_time');if(error){h.innerHTML='<div class="card muted">'+esc(error.message)+'</div>';return}window._crownTours=data||[];h.innerHTML=(data||[]).length?(data||[]).map((x,i)=>`<div class="card tourCard" onclick="openTournament(${i})"><b>${esc(x.event_date)}　${esc((x.start_time||'').slice(0,5))}</b><h3>${esc(x.name)}</h3><p class="muted">ENTRY ¥${Number(x.entry_fee||0).toLocaleString()}${x.starting_stack?' / '+Number(x.starting_stack).toLocaleString()+' STACK':''}</p><div class="tourHint">詳細を見る ›</div></div>`).join(''):'<div class="card muted">この月の公開トーナメントはありません。</div>'}
function yen(v){return v===null||v===undefined||v===''?'—':'¥'+Number(v).toLocaleString()}function num(v){return v===null||v===undefined||v===''?'—':Number(v).toLocaleString()}function openTournament(i){const x=(window._crownTours||[])[i];if(!x)return;document.getElementById('tdName').textContent=x.name||'';let image=x.image_url?`<img class="tourImage" src="${esc(x.image_url)}" alt="">`:'';let prize=x.prize?`<div class="detailItem" style="grid-column:1/-1"><small>PRIZE</small><div class="detailText">${esc(x.prize)}</div></div>`:'';let desc=x.description?`<div class="detailItem" style="grid-column:1/-1"><small>詳細・備考</small><div class="detailText">${esc(x.description)}</div></div>`:'';const start=(x.start_time||'').slice(0,5)||'—',late=(x.late_reg_time||'').slice(0,5)||'—';const sameStack=String(x.starting_stack??'')===String(x.reentry_stack??'')||!x.reentry_stack;const stackValue=sameStack?num(x.starting_stack):num(x.starting_stack)+' / '+num(x.reentry_stack);document.getElementById('tdBody').innerHTML=image+`<div class="detailGrid"><div class="detailItem"><small>開催日</small><b>${esc(x.event_date)}</b></div><div class="detailItem"><small>START / LATE</small><b>${esc(start)} / ${esc(late)}</b></div><div class="detailItem"><small>ENTRY / RE-ENTRY</small><b>${yen(x.entry_fee)} / ${yen(x.reentry_fee)}</b></div><div class="detailItem"><small>STACK</small><b>${stackValue}</b></div>${prize}${desc}</div>`;document.getElementById('tourModal').classList.add('open');document.body.style.overflow='hidden'}function closeTournament(){document.getElementById('tourModal').classList.remove('open');document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTournament()});window.addEventListener('DOMContentLoaded',()=>{init()});setInterval(()=>{if(document.getElementById('ring').classList.contains('active'))loadRing()},5000);
</script></body></html>
